  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ransparent;\n    background:linear-gradient(90deg,#1a1230 0%,#2b1f5c 40%,#3a2470 100%) padding-box,var(--mel-gradient) border-box;\n    box-shadow:0 1px 2px rgba(0,0,0,.15),0 0 12px rgba(90,95,242,.28)}\n  .mel:hover{box-shadow:0 2px 6px rgba(0,0,0,.25),0 0 22px rgba(90,95,242,.5);transform:translateY(-1px)}\n  .mel .melchev{stroke:rgba(250,250,250,.6)!important}\n  .mel:hover .melchev{stroke:#fff!important}\n  .mel{transition:box-shadow .15s,transform .15s}\n  .melchev{width:15px;height:15px;margin-left:auto;stroke:var(--muted-foreground);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}\n  .mel:hover .melchev{stroke:var(--foreground);transform:translateX(2px)}\n  .melmark{width:28px;height:28px;display:block;filter:drop-shadow(0 0 8px rgba(140,120,255,.55))}\n  .profile{background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);overflow:hidden}\n  .profile:hover{border-color:var(--border-strong)}\n  .profile .pav{width:28px;height:28px;font-size:12px}\n  .profiletop{height:54px;display:flex;align-items:center;gap:10px;padding:0 10px;cursor:pointer}\n  .profiletop:hover{background:var(--muted)}\n  .pmeta{line-height:15px;flex:1;min-width:0}\n  .pname{font-size:13px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .prole{font-size:12px;color:var(--muted-foreground)}\n  .teamrow{display:flex;align-items:center;padding:8px 10px;margin-bottom:6px}\n  .teamlogo{height:26px;width:auto;display:block}\n\n  /* ================= sidebar chrome — team-brand fill (light) / dark teal (dark) =================\n     Sidebar bg swaps from the neutral --team-tint whisper to the full saturated team color.\n     All chrome inside the sidebar (nav, section labels, srch, ndot, chevrons, sbtoggle) flips\n     to a light foreground. Popover surfaces that descend from .sidebar (flyouts, pmenu) are\n     explicitly reset to keep their light interior + dark text. Profile card retains white fill. */\n  .sidebar{background:var(--brand-team);color:#fff}\n  /* Dark: teal-tinted panel sitting between page bg #0f1a18 and content card #171717 */\n  body.dark .sidebar{background:#1e3532;color:#fafafa}\n  /* Team wordmark — invert green cursive to white via filter (no new asset) */\n  .sidebar .teamword{filter:brightness(0) invert(1)}\n  /* Collapsed initial pill inverts so it pops on the green rail */\n  .sidebar .teaminit{background:#fff;color:var(--brand-team)}\n  body.dark .sidebar .teaminit{background:#fafafa;color:var(--brand-team)}\n  /* Sidebar-collapse toggle (top-right of sidebar header) */\n  .sidebar .sbtoggle{color:rgba(255,255,255,.78)}\n  .sidebar .sbtoggle:hover{background:rgba(255,255,255,.14);color:#fff}\n  body.dark .sidebar .sbtoggle{color:rgba(250,250,250,.72)}\n  body.dark .sidebar .sbtoggle:hover{background:rgba(255,255,255,.06);color:#fafafa}\n  /* Section labels (\"Main\", etc) — muted white */\n  .sidebar .glabel{color:rgba(255,255,255,.55)}\n  body.dark .sidebar .glabel{color:rgba(250,250,250,.5)}\n  /* Nav rows — light text, translucent hover, bright pill active. Scoped to direct .sidebar\n     children so we don't leak into flyout .nav rows (which stay on the white popover surface). */\n  .sidebar > .nav{color:rgba(255,255,255,.88)}\n  .sidebar > .nav:hover{background:rgba(255,255,255,.12);color:#fff}\n  .sidebar > .nav.active{background:rgba(255,255,255,.96);color:var(--foreground);font-weight:500;box-shadow:0 1px 2px 0 rgb(0 0 0/.05)}\n  .sidebar > .nav.active:hover{background:#fff;color:var(--foreground)}\n  body.dark .sidebar > .nav{color:#e5e5e5}\n  body.dark .sidebar > .nav:hover{background:rgba(255,255,255,.06);color:#fafafa}\n  body.dark .sidebar > .nav.active{background:rgba(255,255,255,.10);color:#fafafa;box-shadow:none}\n  body.dark .sidebar > .nav.active:hover{background:rgba(255,255,255,.14)}\n  /* Chevron on the \"More\" row — force it to inherit dding:12px 16px\"><span class=\"sr-copy\"><span class=\"sr-title\">See commission amounts<\u002Fspan><\u002Fspan><button data-slot=\"switch\" role=\"switch\" aria-checked=\"false\" aria-label=\"See commission amounts\" type=\"button\"><span class=\"switch-thumb\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n        <div class=\"setting-row\" style=\"padding:12px 16px\"><span class=\"sr-copy\"><span class=\"sr-title\">Message the client directly<\u002Fspan><\u002Fspan><button data-slot=\"switch\" role=\"switch\" aria-checked=\"false\" aria-label=\"Message the client directly\" type=\"button\"><span class=\"switch-thumb\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"setting-row\" style=\"padding:12px 16px\"><span class=\"sr-copy\"><span class=\"sr-title\">Remove collaborator<\u002Fspan><span class=\"sr-desc\">Revokes access immediately and frees the seat at the next invoice.<\u002Fspan><\u002Fspan><button data-slot=\"button\" data-variant=\"destructive\" data-size=\"sm\" type=\"button\">Remove collaborator<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"overlay-footer\"><button data-slot=\"button\" data-variant=\"ghost\" type=\"button\" data-close=\"sheet-collaborator\">Cancel<\u002Fbutton><button data-slot=\"button\" data-variant=\"default\" type=\"button\">Save changes<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n\n<div data-slot=\"toaster\" id=\"toaster\" aria-live=\"polite\"><\u002Fdiv>\n<script>\n\n(function(){\n  function warn(fn,reason){console.warn('[' + fn + '] ' + reason)}\n\n  var body=document.body, app=document.querySelector('.app');\n  var tg=document.getElementById('sbtoggle');\n  if(tg) tg.addEventListener('click',function(){app.classList.toggle('collapsed')});\n  var more=document.getElementById('more');\n  if(more) more.addEventListener('click',function(e){e.stopPropagation();more.classList.toggle('open')});\n  var pcard=document.getElementById('profilecard'),pmenu=document.getElementById('pmenu');\n  if(pcard&&pmenu) pcard.addEventListener('click',function(e){e.stopPropagation();pmenu.classList.toggle('open')});\n\n  /* ---- toast (Sonner) ---- */\n  var toaster=document.getElementById('toaster');\n  function toast(msg){\n    if(!toaster){warn('toast','no toaster mount');return}\n    var t=document.createElement('div');\n    t.setAttribute('data-slot','toast');\n    t.innerHTML='<i class=\"ph ph-check-circle icon\"><\u002Fi><span>'+msg+'<\u002Fspan>';\n    var u=document.createElement('button');\n    u.setAttribute('data-slot','button');u.setAttribute('data-variant','link');u.type='button';u.textContent='Undo';\n    t.appendChild(u);toaster.appendChild(t);\n    setTimeout(function(){t.remove()},3200);\n  }\n\n  /* ---- Group commission transparency ---- */\n  (function(){\n    var sheet=document.getElementById('sheet-group');\n    if(!sheet){console.warn('[groupTransparency] sheet-group not found');return}\n    function setMenu(menuId,attr,mode){\n      var menu=sheet.querySelector('#'+menuId);\n      if(!menu){console.warn('[groupTransparency] menu missing: '+menuId);return}\n      menu.querySelectorAll('['+attr+']').forEach(function(it){\n        var on=it.getAttribute(attr)===mode;\n        it.setAttribute('data-active',String(on));\n        it.querySelector('.icon').className='ph ph-'+(on?'check':'minus')+' icon';\n      });\n      sheet.querySelectorAll('['+attr.replace('-mode','-label')+'],['+attr.replace('-mode','help')+']').forEach(function(s){\n        var key=s.getAttribute(attr.replace('-mode','-label'))||s.getAttribute(attr.replace('-mode','help'));\n        s.hidden=key!==mode;\n      });\n    }\n    function apply(state){\n      var hidden=!!state.hidden;\n      sheet.querySelectorAll('[data-gtrow]').forEach(function(r){\n        var k=r.getAttribute('data-gtrow');\n        r.hidden = hidden ? (k!=='radius-summed') : (k==='radius-summed');\n      });\n      var vw=sheet.querySelector('[data-gtvis]');\n      if(vw) vw.querySelectorAll('button[data-gtvis-mode]').fo +'<\u002Fspan><span class=\"rname\">'+r.name+'<\u002Fspan><\u002Fbutton>';\n    }).join('');\n    navEmpty.setAttribute('data-show',hits.length?'false':'true');\n  });\n  results.addEventListener('click',function(e){\n    var b=e.target.closest('.nav-result'); if(!b) return;\n    var r=index[+b.getAttribute('data-i')]; if(!r) return;\n    selectPane(r.key);\n    if(r.el){\n      r.el.classList.remove('row-flash');\n      void r.el.offsetWidth;\n      r.el.classList.add('row-flash');\n      var sb=document.querySelector('.settings-body');\n      if(sb) sb.scrollTop=Math.max(0,r.el.getBoundingClientRect().top-sb.getBoundingClientRect().top+sb.scrollTop-120);\n    }\n  });\n\n  /* ---- role-restricted nav: hide empty groups, drop labels under 6 items ---- */\n  var ROLES={full:null,minimal:['billing','notifications'],finances:['billing','notifications','finances']};\n  function applyRole(role){\n    var allow=ROLES[role];\n    var visible=0;\n    document.querySelectorAll('[data-slot=\"sidebar-menu-item\"]').forEach(function(li){\n      var ok=!allow||allow.indexOf(li.getAttribute('data-key'))>-1;\n      li.hidden=!ok; if(ok) visible++;\n    });\n    document.querySelectorAll('[data-slot=\"sidebar-group\"]').forEach(function(g){\n      var any=[].slice.call(g.querySelectorAll('[data-slot=\"sidebar-menu-item\"]')).some(function(li){return !li.hidden});\n      g.hidden=!any;\n    });\n    body.setAttribute('data-labels',visible<6?'off':'on');\n    var active=document.querySelector('[data-slot=\"sidebar-menu-button\"][data-active=\"true\"]');\n    if(active&&active.closest('[data-slot=\"sidebar-menu-item\"]').hidden){\n      var first=document.querySelector('[data-slot=\"sidebar-menu-item\"]:not([hidden]) [data-slot=\"sidebar-menu-button\"]');\n      if(first) selectPane(first.getAttribute('data-tab'));\n    }\n  }\n  applyRole('full');\n\n  document.getElementById('more-menu').addEventListener('click',function(e){\n    var it=e.target.closest('[data-slot=\"dropdown-menu-item\"]'); if(!it) return;\n    function mark(group,attr){\n      group.forEach(function(x){\n        var on=x===it;\n        x.setAttribute('data-active',String(on));\n        var ic=x.querySelector('.icon'); if(ic) ic.className='ph ph-'+(on?'check':'minus')+' icon';\n      });\n    }\n    if(it.hasAttribute('data-role')){\n      mark([].slice.call(this.querySelectorAll('[data-role]')));\n      applyRole(it.getAttribute('data-role'));\n    }\n    if(it.hasAttribute('data-liststate')){\n      mark([].slice.call(this.querySelectorAll('[data-liststate]')));\n      body.setAttribute('data-liststate',it.getAttribute('data-liststate'));\n    }\n  });\n\n  /* ---- Dialog / Sheet ---- */\n  /* Create vs edit: one overlay serves both. Edit swaps title, description, CTA,\n     reveals [data-edit-only] blocks and pre-fills fields from data-edit-fill. */\n  function applyMode(c,mode,ctx){\n    var edit=mode==='edit';\n    if(ctx){\n      var n=c.querySelector('[data-ctx=\"name\"]'),d2=c.querySelector('[data-ctx=\"desc\"]'),\n          ic=c.querySelector('[data-ctx=\"icon\"]'),dt=c.querySelector('[data-ctx=\"disconnect\"]'),\n          dd=c.querySelector('[data-ctx=\"disconnect-desc\"]');\n      if(n&&ctx.name) n.textContent=ctx.name;\n      if(d2&&ctx.desc) d2.textContent=ctx.desc;\n      if(ic&&ctx.icon){ic.innerHTML='<i class=\"ph ph-'+ctx.icon+' icon\"><\u002Fi>'}\n      if(dt&&ctx.name) dt.textContent='Disconnect '+ctx.name;\n      if(dd&&ctx.name) dd.textContent='Radius stops syncing with '+ctx.name+'. Anything already imported stays.';\n    }\n    var t=c.querySelector('.overlay-title'), d=c.querySelector('.overlay-description');\n    var cta=c.querySelector('.overlay-footer [data-slot=\"button\"][data-variant=\"default\"]');\n    if(!c.hasAttribute('data-create-title')){\n      if(t) c.setAttribute('data-create-title',t.textContent);\n      if(d) c.setAttribute('data-create-description',d.textContent);\n      if(cta) c.setAttribute('data-create-cta',cta.textContent.trim());\n    }\n    if(t) t.textContent=(edit&&c.getAttribute('data-edit-title'))||c.getAttribute('data-create-title')||t.textContent;\n    if(d) d.textContent=(edit&&c.getAttribute('data-edit-description'))||c.getAttribute('data-create-description')||d.textContent;\n    if(cta) cta.textContent=(edit&&c.getAttribute('data-edit-cta'))||c.getAttribute('data-create-cta')||cta.textContent;\n    c.querySelectorAll('[data-edit-only]').forEach(function(el){el.hidden=!edit});\n    c.querySelectorAll('[data-create-only]').forEach(function(el){el.hidden=!!edit});\n    if(c.id==='sheet-group'&&typeof window.applyGroupTransparency==='function') window.applyGroupTransparency(edit);\n    if(c.id==='sheet-brandrule'&&typeof window.applyBrandRule==='function') window.applyBrandRule(edit);\n    var fillRaw=c.getAttribute('data-edit-fill');\n    if(fillRaw){\n      var fill={};\n      try{fill=JSON.parse(fillRaw)}catch(err){warn('applyMode','bad data-edit-fill on '+c.id+': '+err.message)}\n      c.querySelectorAll('[data-slot=\"input\"]').forEach(function(i){\n        var key=i.getAttribute('placeholder')||i.getAttribute('value');\n        if(!edit){ if(i.hasAttribute('data-filled')){i.value='';i.removeAttribute('data-filled')} return }\n        if(key&&Object.prototype.hasOwnProperty.call(fill,key)){i.value=fill[key];i.setAttribute('data-filled','true')}\n      });\n    }\n  }\n  function openOverlay(spec,ctx){\n    var parts=String(spec).split('#'), id=parts[0], mode=parts[1]||'create';\n    var c=document.getElementById(id); if(!c){warn('openOverlay','no overlay '+id);return}\n    applyMode(c,mode,ctx);\n    c.setAttribute('data-state','open');\n    var ov=document.querySelector('[data-slot$=\"-overlay\"][data-close=\"'+id+'\"]');\n    if(ov) ov.setAttribute('data-state','open');\n    var f=c.querySelector('.overlay-body [data-slot=\"input\"]')||c.querySelector('.overlay-body [data-slot=\"button\"]'); if(f) f.focus();\n  }\n  function closeOverlay(id){\n    var c=document.getElementById(id); if(c) c.removeAttribute('data-state');\n    var ov=document.querySelector('[data-slot$=\"-overlay\"][data-close=\"'+id+'\"]');\n    if(ov) ov.removeAttribute('data-state');\n  }\n  var OPENERS={'open-invite':'dialog-invite','open-license':'dialog-license','open-port':'dialog-port','open-fee':'dialog-fee','open-pod':'sheet-pod','open-pod-edit':'sheet-pod#edit','open-campaign':'sheet-campaign','open-template':'sheet-template','open-group':'sheet-group'};\n  /* pane + button label -> overlay. '*' matches any pane. */\n  var RESOLVE={\n    'email-settings|Create template':'sheet-email-template',\n    'email-settings|Edit':'sheet-email-template',\n    'accounts|Edit contact details':'dialog-contact',\n    'accounts|Edit':'dialog-business',\n    'accounts|Delete account':'dialog-delete-account',\n    'accounts|Add license':'dialog-license',\n    'email-settings|Edit signature':'sheet-signature',\n    'email-settings|Set up':'dialog-comms-email',\n    'email-settings|Disconnect':'dialog-disconnect',\n    'phone-numbers|Buy a number':'dialog-buy-number',\n    'phone-numbers|Assign':'dialog-assign-number',\n    'phone-numbers|Release':'dialog-release-number',\n    'team-settings|Edit information':'dialog-team-info',\n    'members|Add team members':'dialog-invite',\n    'members|Manage':'sheet-member',\n    'groups|New group':'sheet-group',\n    'collaborators|Add collaborator':'dialog-collab-type',\n    'collaborators|Manage defaults':'sheet-manage-defaults',\n    'collaborators|Manage':'sheet-collaborator',\n    'custom-fields|Field':'dialog-field',\n    'custom-fields|Edit field':'dialog-field#edit',\n    'billing|Add a card':'dialog-card',\n    'finances|Change':'dialog-payout',\n    'integrations|Connect':'dialog-connect',\n    'integrations|Manage':'dialog-connect#edit',\n    'cda-settings|Preview CDA':'dialog-cda-preview',\n    'cda-settings|Add fee':'dialog-fee',\n    'transaction-settings|New template':'sheet-template',\n    'transaction-settings|Edit':'sheet-template#edit',\n    'pods|Edit':'sheet-pod#edit',\n    'ai-campaign|New campaign':'sheet-campaign',\n    '*|Remove':'dialog-remove'\n  };\n  function resolveOverlay(btn){\n    var label=(btn.textContent||'').trim();\n    if(!label) return null;\n    var pane=btn.closest('[data-slot=\"tabpanel\"]');\n    var key=pane?pane.getAttribute('data-pane'):null;\n    if(key&&RESOLVE[key+'|'+label]) return RESOLVE[key+'|'+label];\n    return RESOLVE['*|'+label]||null;\n  }\n  document.addEventListener('click',function(e){\n    var o=e.target.closest('[id]');\n    if(o&&OPENERS[o.id]){openOverlay(OPENERS[o.id]);return}\n    var d=e.target.closest('[data-open]');\n    if(d){var cl=d.getAttribute('data-close'); if(cl) closeOverlay(cl); openOverlay(d.getAttribute('data-open')); return}\n    var btn=e.target.closest('[data-slot=\"button\"],.add-tile');\n    if(btn&&!btn.closest('[data-slot=\"dialog-content\"],[data-slot=\"sheet-content\"],.overlay-footer,.route-page')){\n      var target=resolveOverlay(btn);\n      if(target){\n        var tile=btn.closest('.tile'),ctx=null;\n        if(tile){\n          var nm=tile.querySelector('.tile-name'),ds=tile.querySelector('p'),ig=tile.querySelector('.row-icon i.ph,.row-icon svg');\n          ctx={name:nm?nm.textContent.trim():'',desc:ds?ds.textContent.trim():'',\n               icon:ig?((Array.prototype.find.call(ig.classList,function(c){return c.indexOf('ph-')===0})||'').slice(3)):''};\n        }\n        openOverlay(target,ctx);return;\n      }\n    }\n    var c=e.target.closest('[data-close]');\n    if(c){closeOverlay(c.getAttribute('data-close'));return}\n    var r=e.target.closest('[data-close-route]');\n    if(r){setRoute(r.getAttribute('data-close-route'),false);}\n  });\n  document.addEventListener('keydown',function(e){\n    if(e.key!=='Escape') return;\n    document.querySelectorAll('[data-slot=\"dialog-content\"][data-state],[data-slot=\"sheet-content\"][data-state]').forEach(function(c){closeOverlay(c.id)});\n    document.q addEventListener('click',function(){setRole(b.getAttribute('data-role-set'))})});\n    var saved=null; try{saved=localStorage.getItem('radius-role-view')}catch(e){}\n    setRole(saved==='agent'||saved==='agent-edit'?saved:'tl');\n  });\n<\u002Fscript>\n<div class=\"roleswitch\" id=\"roleswitch\" data-open=\"false\">\n  <button class=\"rs-tab\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rs-panel\"><i class=\"ph ph-user-switch\" aria-hidden=\"true\"><\u002Fi>View as<\u002Fbutton>\n  <div class=\"rs-panel\" id=\"rs-panel\" role=\"group\" aria-label=\"View as\">\n    <span class=\"rs-head\">View this page as<\u002Fspan>\n    <button class=\"rs-opt\" type=\"button\" data-role-set=\"tl\" aria-pressed=\"true\"><span class=\"rs-dot\"><\u002Fspan><span class=\"rs-lab\"><span class=\"rs-name\">TL, admin, ops, assistant<\u002Fspan><span class=\"rs-sub\">Team branding, branding groups and the rules table.<\u002Fspan><\u002Fspan><\u002Fbutton>\n    <button class=\"rs-opt\" type=\"button\" data-role-set=\"agent\" aria-pressed=\"false\"><span class=\"rs-dot\"><\u002Fspan><span class=\"rs-lab\"><span class=\"rs-name\">Agent<\u002Fspan><span class=\"rs-sub\">My branding only — locked, set by the team.<\u002Fspan><\u002Fspan><\u002Fbutton>\n    <button class=\"rs-opt\" type=\"button\" data-role-set=\"agent-edit\" aria-pressed=\"false\"><span class=\"rs-dot\"><\u002Fspan><span class=\"rs-lab\"><span class=\"rs-name\">Agent who can edit branding<\u002Fspan><span class=\"rs-sub\">My branding with an editable logo and color.<\u002Fspan><\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
